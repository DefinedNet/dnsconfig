name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff #v5.6.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Check README example
        if: runner.os == 'macOS'
        run: ./scripts/check-readme-go.sh README.md
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff #v5.6.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
      - name: Lint (darwin)
        run: golangci-lint run ./...
      - name: Lint (windows)
        run: GOOS=windows golangci-lint run ./...

  smoke-macos:
    uses: ./.github/workflows/smoke-macos.yml

  smoke-windows:
    uses: ./.github/workflows/smoke-windows.yml

  ci-pass-fail:
    name: pass/fail check
    if: always()
    needs: [test, lint, smoke-macos, smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
